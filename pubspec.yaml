name: live_bank
version: 1.0.0+1

description: Live Bank - Sua conta digital premium.

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  cupertino_icons: ^1.0.2
  http: ^1.4.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  google_fonts: ^8.1.0
  share_plus: ^12.0.2
  intl: 0.20.2
  path: ^1.8.3
  pdf: ^3.10.8
  mask_text_input_formatter: ^2.9.0
  path_provider: ^2.1.5
  fl_chart: ^1.2.0  # Versão mais recente estável
  flutter_local_notifications: ^17.0.0  # Atualizado para a versão mais recente
  cached_network_image: ^3.4.1
  archive: ^3.4.10
  crypto: ^3.0.3
  device_info_plus: ^11.4.0  # Para obter informações do dispositivo
  connectivity_plus: ^5.0.2
  encrypt: ^5.0.3
  package_info_plus: ^8.3.0
  local_auth: ^2.2.0  # Para autenticação biométrica
  logging: ^1.2.0  # Para logging em produção
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  build_runner: ^2.4.13
  screenshot: ^3.0.0
  flutter_image_compress: ^2.4.0
  image_cropper: ^12.2.1
  shimmer: ^3.0.0
  mobile_scanner: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/icon/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21